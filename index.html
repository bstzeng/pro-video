<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博雅動圖館</title>
<meta name="description" content="博雅書院課程裡的互動視覺化，錄成一張張會動的圖。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="brand">🎞 博雅動圖館</a>
    <nav class="site-nav">
      <a href="#topics">主題</a>
      <a class="professor-link" href="https://bstzeng.github.io/professor/" target="_blank" rel="noopener">博雅書院 ↗</a>
    </nav>
  </div>
</header>

<main>
  <section class="hero">
    <div class="container">
      <p class="hero-eyebrow">博雅書院的互動視覺化</p>
      <h1>博雅動圖館</h1>
      <div class="hero-rule"></div>
      <p class="hero-sub">
        把課程裡的模擬與互動元件錄成動圖。
        先選分類、再選主題，進到主題頁就能看到這門課的動圖。
      </p>
      <p id="hero-stats" class="hero-stats"></p>
    </div>
  </section>

  <section id="topics" class="topics-section">
    <div class="container">
      <div class="topics-section-header">
        <h2>主題總覽</h2>
        <div class="topics-tools">
          <label class="only-clips">
            <input id="only-clips" type="checkbox">
            <span>只看有動圖的主題</span>
          </label>
          <button id="toggle-all" class="toggle-all-btn" type="button">全部展開</button>
        </div>
      </div>
      <label class="search">
        <span class="visually-hidden">搜尋主題</span>
        <input id="search" type="search" placeholder="搜尋主題" autocomplete="off">
      </label>
      <div id="groups"></div>
      <p id="empty" class="empty-state" hidden></p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    動圖由 <code>tools/capture.py</code> 從博雅書院的課程頁自動錄製。
  </div>
</footer>

<script src="data/gallery.js"></script>
<script src="js/common.js"></script>
<script src="js/home.js"></script>
</body>
</html>
